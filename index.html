<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DataVisual SV — Demo Ferretería · Selector de Paquete</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&family=Syne:wght@600;700;800&family=Raleway:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#FFF7ED;color:#1E293B;font-size:13px;min-height:100vh}

/* ════ PKG SELECTOR ════ */
.pkg-bar{
  background:#07101E;display:flex;align-items:stretch;
  border-bottom:1px solid rgba(255,255,255,.06);
  position:sticky;top:0;z-index:200;
}
.pkg-bar-label{
  display:flex;align-items:center;padding:0 20px;
  font-family:'DM Mono',monospace;font-size:9px;font-weight:500;
  color:rgba(255,255,255,.25);letter-spacing:2.5px;white-space:nowrap;
  border-right:1px solid rgba(255,255,255,.06);
}
.pkg-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 6px;cursor:pointer;border:none;background:transparent;
  border-right:1px solid rgba(255,255,255,.06);
  transition:background .2s;position:relative;gap:2px;
}
.pkg-btn:last-child{border-right:none}
.pkg-btn:hover{background:rgba(255,255,255,.05)}
.pkg-btn-name{font-size:11px;font-weight:800;letter-spacing:.5px;color:rgba(255,255,255,.3);transition:color .2s}
.pkg-btn-desc{font-size:9px;font-weight:400;color:rgba(255,255,255,.2);letter-spacing:.3px}
.pkg-btn-price{font-family:'DM Mono',monospace;font-size:10px;font-weight:600;color:rgba(255,255,255,.3);transition:color .2s}
.pkg-btn::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;transition:background .2s}

.pkg-btn.sel-s{background:rgba(234,88,12,.08)}
.pkg-btn.sel-s .pkg-btn-name{color:#EA580C}
.pkg-btn.sel-s .pkg-btn-price{color:#EA580C}
.pkg-btn.sel-s .pkg-btn-desc{color:rgba(234,88,12,.6)}
.pkg-btn.sel-s::after{background:#EA580C}

.pkg-btn.sel-g{background:rgba(5,150,105,.08)}
.pkg-btn.sel-g .pkg-btn-name{color:#10B981}
.pkg-btn.sel-g .pkg-btn-price{color:#10B981}
.pkg-btn.sel-g .pkg-btn-desc{color:rgba(16,185,129,.6)}
.pkg-btn.sel-g::after{background:#10B981}

.pkg-btn.sel-p{background:rgba(37,99,235,.08)}
.pkg-btn.sel-p .pkg-btn-name{color:#60A5FA}
.pkg-btn.sel-p .pkg-btn-price{color:#60A5FA}
.pkg-btn.sel-p .pkg-btn-desc{color:rgba(96,165,250,.6)}
.pkg-btn.sel-p::after{background:#2563EB}

/* ════ ROOT FADE ════ */
#root{transition:opacity .2s ease}
#root.fading{opacity:0;pointer-events:none}

/* ════ SHARED LAYOUT ════ */
.topbar{display:flex;align-items:center;padding:0 24px;height:54px;border-bottom:4px solid var(--acc)}
.brand{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;color:rgba(255,255,255,.3);letter-spacing:2px}
.top-title{flex:1;text-align:center;font-size:15px;font-weight:800;color:#fff}
.pkg-badge{font-family:'DM Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1.5px;padding:5px 14px;border-radius:3px;white-space:nowrap}

.subbar{padding:10px 24px 13px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06)}
.subbar-info h2{font-size:14px;font-weight:800;color:#fff;margin-bottom:3px}
.subbar-info p{font-size:11px;color:rgba(255,255,255,.4)}
.subbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.src-chip{font-size:9px;font-weight:700;padding:3px 10px;border-radius:3px;font-family:'DM Mono',monospace}
.per-chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:11px;font-weight:600;padding:5px 14px;border-radius:3px}

.filters{background:#fff;border-bottom:1px solid #FED7AA;padding:9px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.f-lbl{font-size:10px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.filters select{border:1px solid #FED7AA;border-radius:5px;padding:5px 10px;font-size:11px;color:#1E293B;font-family:'DM Sans',sans-serif;outline:none;cursor:pointer}
.filters select:focus{border-color:var(--acc)}
.f-sep{width:1px;height:18px;background:#FED7AA;flex-shrink:0}
.f-space{flex:1}
.f-wm{color:#CBD5E1;font-size:9px;font-weight:700;letter-spacing:2px;font-family:'DM Mono',monospace}

/* alert */
.alert-bar{margin:14px 24px 0;border-radius:6px;padding:9px 14px;font-size:11px;font-weight:600;border-left:4px solid;line-height:1.6}
.alert-bar.ok{background:#ECFDF5;border-color:#059669;color:#064E3B}
.alert-bar.warn{background:#FFFBEB;border-color:#D97706;color:#78350F}
.alert-bar.crit{background:#FEF2F2;border-color:#DC2626;color:#7F1D1D}

/* tabs */
.tabs{display:flex;background:#fff;border-bottom:2px solid #FED7AA;padding:0 24px;overflow-x:auto}
.tab{padding:10px 18px;font-size:12px;font-weight:700;color:#64748B;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab.active{border-bottom-color:var(--acc);color:var(--acc-dark,#431407)}
.tab:hover:not(.active){background:#FFF7ED}
.tabcontent{display:none}.tabcontent.active{display:block}
.tab-pill{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;background:#FFF7ED;color:#94A3B8;font-family:'DM Mono',monospace}
.tab.active .tab-pill{background:var(--acc-light);color:var(--acc)}

/* kpi grids */
.kpi-grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 24px}
.kpi-grid-6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:14px 24px}
.kpi-grid-free{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;padding:14px 24px}

/* kpi card */
.kpi{background:#fff;border-radius:8px;border:1px solid #FED7AA;padding:13px 15px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;cursor:default}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(67,20,7,.08)}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:3px}
.kpi-lbl{font-size:9px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.kpi-val{font-size:21px;font-weight:800;color:#0F172A;line-height:1;margin-bottom:3px}
.kpi-delta{font-size:10px;font-weight:700}
.up{color:#059669}.dn{color:#DC2626}.neutral{color:#64748B}
.kpi-sub{font-size:9px;color:#94A3B8;margin-top:2px}
.kpi-rag{position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%}
.kpi-rag.g{background:#059669;box-shadow:0 0 7px rgba(5,150,105,.6)}
.kpi-rag.a{background:#D97706;box-shadow:0 0 7px rgba(217,119,6,.6)}
.kpi-rag.r{background:#DC2626;box-shadow:0 0 7px rgba(220,38,38,.6)}
.kpi-thresh{position:absolute;bottom:10px;right:10px;font-size:8px;font-weight:700;padding:2px 6px;border-radius:10px;font-family:'DM Mono',monospace}
.kpi-thresh.g{background:#ECFDF5;color:#059669}
.kpi-thresh.r{background:#FEF2F2;color:#DC2626}
.kpi-thresh.a{background:#FFFBEB;color:#D97706}

/* layouts */
.g2{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;padding:0 24px 12px}
.g21{display:grid;grid-template-columns:3fr 2fr;gap:12px;padding:0 24px 12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:0 24px 12px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;padding:0 24px 12px}
.gfull{padding:0 24px 12px}

/* card */
.card{background:#fff;border-radius:8px;border:1px solid #FED7AA;padding:16px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:12px;font-weight:700;color:#0F172A;display:flex;align-items:center;gap:6px}
.card-tag{font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px}
.exp-btn{background:#FFF7ED;border:1px solid #FED7AA;border-radius:4px;padding:3px 8px;font-size:9px;font-weight:700;cursor:pointer;color:#64748B;font-family:'DM Sans',sans-serif;transition:.15s}
.exp-btn:hover{background:#fff;color:#431407;border-color:var(--acc)}

/* sucursal bar */
.suc-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #FFF7ED}
.suc-row:last-child{border:none}
.suc-name{font-size:12px;font-weight:700;color:#431407;width:115px;line-height:1.3}
.suc-detail{flex:1}
.suc-bar-wrap{background:#F1F5F9;border-radius:4px;height:10px;overflow:hidden;margin-bottom:3px}
.suc-bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
.suc-meta{font-size:9px;color:#94A3B8;display:flex;justify-content:space-between}
.suc-val{font-size:14px;font-weight:800;width:60px;text-align:right}

/* ABC */
.abc-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #FFF7ED}
.abc-item:last-child{border:none}
.abc-badge{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#fff;flex-shrink:0}
.abc-name{flex:1;font-weight:600;color:#1E293B;font-size:10px}
.abc-rev{font-weight:700;font-size:11px}
.abc-rot{font-size:9px;color:#94A3B8}

/* table */
.tbl-srch{display:flex;gap:8px;margin-bottom:10px}
.tbl-srch input{border:1px solid #FED7AA;border-radius:5px;padding:6px 10px;font-size:11px;font-family:'DM Sans',sans-serif;outline:none;flex:1}
.tbl-srch input:focus{border-color:var(--acc)}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl thead th{background:#FFF7ED;color:#431407;font-weight:700;padding:7px 10px;text-align:left;border-bottom:2px solid #FED7AA;font-size:9px;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.tbl thead th:hover{color:#EA580C}
.tbl td{padding:7px 10px;border-bottom:1px solid #FFF7ED;color:#374151}
.tbl tr:hover td{background:#FFF7ED}
.badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px}
.badge-g{background:#D1FAE5;color:#065F46}
.badge-r{background:#FEE2E2;color:#991B1B}
.badge-a{background:#FEF3C7;color:#92400E}
.pg-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid #FED7AA}
.pg-btn{border:1px solid #FED7AA;background:#fff;border-radius:4px;padding:4px 10px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;color:#64748B}
.pg-btn:hover{background:#FFF7ED}

/* RAG strip */
.rag-strip{display:flex;margin:14px 24px 0;border-radius:6px;overflow:hidden;border:1px solid #FED7AA}
.rag-cell{flex:1;padding:7px 12px;font-size:10px;font-weight:700;display:flex;align-items:center;gap:6px;border-right:1px solid #FED7AA}
.rag-cell:last-child{border-right:none}
.rag-cell.r{background:#FEF2F2;color:#DC2626}
.rag-cell.a{background:#FFFBEB;color:#D97706}
.rag-cell.g{background:#ECFDF5;color:#059669}
.rag-dot{width:8px;height:8px;border-radius:50%}
.rag-dot.r{background:#DC2626}.rag-dot.a{background:#D97706}.rag-dot.g{background:#059669}

/* exec hero */
.exec-hero{border-radius:8px;padding:20px 24px;display:flex;align-items:center;gap:28px;margin:14px 24px 0}
.exec-hero h2{font-family:'Raleway',sans-serif;font-size:11px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
.exec-hero .big{font-family:'Raleway',sans-serif;font-size:36px;font-weight:900;color:#fff;line-height:1}
.exec-hero .sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:5px}
.exec-stats{display:flex;gap:22px;flex-shrink:0}
.estat .ev{font-family:'Raleway',sans-serif;font-size:22px;font-weight:900;color:var(--acc)}
.estat .el{font-size:9px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* rag summary cards */
.rag-summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 24px 0}
.rag-item{background:#fff;border-radius:6px;border:1px solid #FED7AA;padding:10px 14px;flex:1;min-width:140px}
.rag-item .ri-l{font-size:9px;color:#94A3B8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-weight:700}
.rag-item .ri-v{font-size:17px;font-weight:900;color:#0F172A;font-family:'DM Mono',monospace;line-height:1.1}
.rag-item .ri-s{font-size:10px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:4px}

/* locked hint */
.locked-hint{background:#FFF7ED;border:2px dashed #FED7AA;border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:#94A3B8;font-size:11px}
.locked-hint .lk-icon{font-size:22px}
.locked-hint .lk-title{font-size:12px;font-weight:700;color:#64748B}
.locked-hint .lk-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px}

/* stock level bar */
.stk-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #FFF7ED}
.stk-item:last-child{border:none}
.stk-name{width:140px;font-weight:600;color:#1E293B;font-size:10px}
.stk-bar-wrap{flex:1;background:#F1F5F9;border-radius:4px;height:8px;overflow:hidden}
.stk-bar-fill{height:100%;border-radius:4px}
.stk-val{width:55px;text-align:right;font-size:10px;font-weight:700;font-family:'DM Mono',monospace}

/* pkg float */
.pkg-float{position:fixed;bottom:20px;right:20px;font-size:10px;font-weight:800;padding:6px 16px;border-radius:4px;font-family:'DM Mono',monospace;z-index:300;letter-spacing:.5px;cursor:default;transition:all .3s}

/* footer */
.disclaimer{background:#fff;border-top:1px solid #FED7AA;padding:6px 24px;font-size:9px;color:#94A3B8;text-align:center;margin-top:6px}
.footer{text-align:center;padding:8px;color:rgba(255,255,255,.25);font-size:9px;letter-spacing:.5px;font-family:'DM Mono',monospace}
</style>
</head>
<body>

</div>

/* ── NAVEGABLE TABLE (growth+pro) ── */
function genRows(d){
  const prods=d.abc.map(a=>a.n);
  const cats=['Construcción','Plomería','Electricidad','Herramientas','Pintura'];
  const est=['g','g','g','a','r'];
  const rows=[];const base=new Date(2025,4,31);
  for(let i=0;i<55;i++){
    const dt=new Date(base);dt.setDate(base.getDate()-i);
    const p=prods[i%prods.length];
    const cat=cats[i%cats.length];
    const u=Math.floor(2+Math.random()*25);
    const pr=parseFloat((15+Math.random()*120).toFixed(2));
    const tot=parseFloat((u*pr).toFixed(2));
    const mar=Math.floor(22+Math.random()*25);
    const e=est[Math.floor(Math.random()*est.length)];
    rows.push({f:dt.toLocaleDateString('es-SV'),prod:p,cat,suc:i%2===0?'Central':'Norte',u,tot,mar,e});
  }
  return rows;
}

    <div class="g21" style="padding-bottom:4px">
      <div class="card">
        <div class="card-hd"><div class="card-title">📊 Ventas por Semana — Ambas Sucursales</div><button class="exp-btn" onclick="expChart('cSucComp')">⬇ PNG</button></div>
        <canvas id="cSucComp" height="110"></canvas>
      </div>
      <div class="card">
        <div class="card-hd"><div class="card-title">🏪 Desempeño vs Meta</div><div class="card-tag" style="background:${T.accLight};color:${T.accText}">% cumplimiento</div></div>
        <div id="sucRows" style="margin-top:6px">${buildSuc(d)}</div>
      </div>
    </div>
    <div class="gfull" style="padding-bottom:16px">
      <div class="card">
        <div class="card-hd"><div class="card-title">📈 Sucursales: 2025 vs 2024 (6 meses)</div><button class="exp-btn" onclick="expChart('cSucTrend')">⬇ PNG</button></div>
        <canvas id="cSucTrend" height="80"></canvas>
      </div>
    </div>
  </div>

  <div class="disclaimer">⚠ Datos de demostración. Los datos reales provienen de las fuentes del cliente. · datavisualsv.com</div>
  <div class="footer" style="background:${T.footBg}">© 2025 DataVisual SV · Paquete PRO · URL personalizada · Sistema RAG · 3 rondas de ajustes · hola@datavisualsv.com</div>`;
}

/* ══════════════════════
   CHARTS
══════════════════════ */
function buildCharts(){
  const T=TH[curPkg];
  const d=D[curPer];
  const ACC=T.acc;
  const grid=T.grid;

  // Semanas (barras dobles sucursales)
  const semCfg={type:'bar',data:{labels:['S1 (1–7)','S2 (8–14)','S3 (15–21)','S4 (22–28)'],datasets:[
    {label:'Central',data:d.semS,backgroundColor:ACC+'CC',borderRadius:4},
    {label:'Norte',data:d.semN,backgroundColor:'#2563EB99',borderRadius:4},
  ]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},
    scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{ticks:{callback:v=>'$'+v.toLocaleString()},grid:{color:grid}}}}};
  mk('cSemanas',semCfg);
  mk('cSucComp',JSON.parse(JSON.stringify(semCfg)));

  // Márgenes horizontal
  const margCfg={type:'bar',data:{labels:d.cats,datasets:[{label:'Margen %',data:d.marg,
    backgroundColor:d.marg.map(m=>m>=35?'rgba(5,150,105,.85)':m>=28?`${ACC}CC`:'rgba(220,38,38,.75)'),borderRadius:5}]},
    options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},
      scales:{x:{max:50,ticks:{callback:v=>v+'%'},grid:{color:grid}},y:{grid:{display:false},ticks:{font:{size:10}}}}}};
  mk('cMargenes',margCfg);

  // Tendencia mensual 2025 vs 2024
  mk('cTrend',{type:'line',data:{labels:['Ene','Feb','Mar','Abr','May'],datasets:[
    {label:'2025',data:[29800,30500,31840,35190,38420],borderColor:ACC,backgroundColor:ACC+'22',fill:true,tension:.4,pointRadius:4,pointBackgroundColor:ACC,pointBorderColor:'#fff',pointBorderWidth:2},
    {label:'2024',data:[26500,27200,27400,28900,31200],borderColor:'#94A3B8',borderDash:[5,5],borderWidth:1.5,pointRadius:3,backgroundColor:'transparent'}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:9}}}},
      scales:{y:{ticks:{callback:v=>'$'+v.toLocaleString()},grid:{color:grid}},x:{grid:{display:false},ticks:{font:{size:9}}}}}});

  // Comparativo 3 meses
  mk('cComp',{type:'bar',data:{labels:PER.slice().reverse(),datasets:[
    {label:'2025',data:[D[2].vt,D[1].vt,D[0].vt],backgroundColor:[ACC+'44',ACC+'88',ACC+'EE'],borderRadius:4},
    {label:'Meta',data:[D[2].meta,D[1].meta,D[0].meta],type:'bar',backgroundColor:'rgba(220,38,38,.1)',borderWidth:1.5,borderColor:'#DC2626',borderRadius:4}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:9}}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:9}}},y:{ticks:{callback:v=>'$'+v.toLocaleString()},grid:{color:grid}}}}});

  // PRO: Proyección
  mk('cProj',{type:'line',data:{labels:['Ene','Feb','Mar','Abr','May','Jun*','Jul*','Ago*'],datasets:[
    {label:'2025 Real',data:[29800,30500,31840,35190,38420,null,null,null],borderColor:ACC,backgroundColor:ACC+'22',fill:true,tension:.4,pointRadius:4},
    {label:'Proyección',data:[null,null,null,null,38420,40100,42000,44200],borderColor:'#059669',borderDash:[6,3],backgroundColor:'rgba(5,150,105,.08)',fill:true,tension:.4,pointRadius:4,borderWidth:2},
    {label:'2024',data:[26500,27200,27400,28900,31200,null,null,null],borderColor:'#94A3B8',borderDash:[4,4],borderWidth:1.5,pointRadius:3}]},
    options:{responsive:true,spanGaps:true,plugins:{legend:{position:'bottom',labels:{font:{size:9}}}},
      scales:{y:{ticks:{callback:v=>'$'+v.toLocaleString()},grid:{color:grid}},x:{grid:{display:false},ticks:{font:{size:9}}}}}});

  // PRO: Year comp sucursales
  mk('cYearComp',{type:'bar',data:{labels:['Central','Norte'],datasets:[
    {label:'2025',data:[d.suc[0].v,d.suc[1].v],backgroundColor:[ACC+'CC','#2563EBCC'],borderRadius:4},
    {label:'2024',data:[Math.floor(d.suc[0].v*.92),Math.floor(d.suc[1].v*.95)],backgroundColor:['rgba(148,163,184,.5)','rgba(148,163,184,.4)'],borderRadius:4}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:9}}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:9}}},y:{ticks:{callback:v=>'$'+v.toLocaleString()},grid:{color:grid}}}}});

  // PRO: Inventario
  mk('cInv',{type:'bar',data:{labels:d.inv.map(i=>i.p),datasets:[
    {label:'Stock Actual',data:d.inv.map(i=>i.s),backgroundColor:d.inv.map(i=>i.t==='r'?'rgba(220,38,38,.8)':i.t==='a'?'rgba(217,119,6,.8)':'rgba(5,150,105,.8)'),borderRadius:4},
    {label:'Stock Mínimo',data:d.inv.map(i=>i.min),backgroundColor:'rgba(10,18,40,.18)',borderRadius:4}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:9}}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:8}}},y:{ticks:{callback:v=>v+' u.'},grid:{color:grid}}}}});

  // PRO: Costos pie
  mk('cCostos',{type:'pie',data:{labels:['Compras','Nómina','Renta','Servicios','Otros'],
    datasets:[{data:[38,28,16,10,8],backgroundColor:['#DC2626','#431407',ACC,'#2563EB','#94A3B8'],borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:9},padding:5}}}}});

  // PRO: Suc tendencia
  mk('cSucTrend',{type:'line',data:{labels:['Dic','Ene','Feb','Mar','Abr','May'],datasets:[
    {label:'Central 2025',data:[20500,21200,21800,19800,21700,23800],borderColor:ACC,backgroundColor:ACC+'22',fill:false,tension:.4,pointRadius:4},
    {label:'Norte 2025',data:[10800,11200,11600,12040,13490,14620],borderColor:'#2563EB',backgroundColor:'#2563EB22',fill:false,tension:.4,pointRadius:4},
    {label:'Central 2024',data:[18900,19600,20000,18200,20000,21900],borderColor:ACC+'55',borderDash:[4,4],borderWidth:1.5,pointRadius:2},
    {label:'Norte 2024',data:[9800,10200,10500,11200,12400,13500],borderColor:'#2563EB55',borderDash:[4,4],borderWidth:1.5,pointRadius:2}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:9},padding:4}}},
      scales:{y:{ticks:{callback:v=>'$'+v.toLocaleString()},grid:{color:grid}},x:{grid:{display:false},ticks:{font:{size:9}}}}}});

  // CxC table
  buildCxcTable(d,'cxcTbl');
}

/* ══════════════════════
   RENDER DISPATCHER
══════════════════════ */
function render(){
  const T=TH[curPkg];
  applyTheme(T);
  const root=document.getElementById('root');

  if(curPkg==='s') root.innerHTML=buildStarter(T);
  else if(curPkg==='g') root.innerHTML=buildGrowth(T);
  else root.innerHTML=buildPro(T);

  // float badge
  let fb=document.getElementById('pkgFloat');
  if(!fb){fb=document.createElement('div');fb.id='pkgFloat';fb.className='pkg-float';document.body.appendChild(fb);}
  fb.style.background=T.floatBg;fb.style.color=T.floatTxt;
  fb.style.boxShadow=`0 4px 20px ${T.acc}55`;
  fb.textContent=T.name;

  requestAnimationFrame(()=>buildCharts());

  // tabla navegable
  allRows=genRows(D[curPer]);filtRows=allRows.slice();pg=0;renderTbl();
}

/* ── INIT ── */
applyTheme(TH['s']);
render();
</script>
